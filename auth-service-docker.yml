server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres-auth:5432/authdb
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
