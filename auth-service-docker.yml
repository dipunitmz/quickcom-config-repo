server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres-auth:5432/authdb
    username: admin
    password: password
    hikari:
      initialization-fail-timeout: -1        # ← retry DB connection forever
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
